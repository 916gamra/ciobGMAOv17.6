[package]
name = "bdr-nexus-gmao"
version = "17.6.0"
description = "BDR Nexus Industrial CMMS System"
authors = ["BDR Systems Engineering"]
license = "MIT"
repository = ""
default-run = "bdr-nexus-gmao"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "system-tray", "updater", "notification", "global-shortcut", "clipboard-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
winreg = "0.50"
sysinfo = "0.30"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[features]
# custom features
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
