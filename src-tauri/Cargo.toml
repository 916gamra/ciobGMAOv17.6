[package]
name = "bdr-nexus"
version = "17.6.0"
description = "Industrial CMMS System - BDR Nexus"
authors = ["BDR Systems <info@bdrsystems.com>"]
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
# Tauri & Core
tauri = { version = "1.5", features = [
    "shell-open",
    "system-tray",
    "updater",
    "window-all",
    "dialog-all",
    "fs-all",
    "path-all",
    "http-all"
] }
tauri-plugin-store = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }

# Serialization
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

# Async Runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"

# Database
sqlx = { version = "0.7", features = [
    "runtime-tokio-native-tls",
    "sqlite",
    "postgres",
    "uuid",
    "chrono",
    "json"
] }
rusqlite = { version = "0.30", features = ["bundled", "chrono", "uuid"] }

# Cryptography
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
rand = "0.8"
base64 = "0.21"
zeroize = { version = "1.6", features = ["derive"] }

# Windows-specific
winreg = "0.50"
winapi = { version = "0.3", features = ["winuser", "winbase", "winerror"] }
windows = { version = "0.51", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Registry"
] }

# System Info
sysinfo = "0.30"
hostname = "0.3"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "1.0"

# HTTP Client
reqwest = { version = "0.11", features = ["json"] }

# Regex
regex = "1.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
