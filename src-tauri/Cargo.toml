[package]
name = "bdr-nexus-gmao"
version = "17.6.0"
description = "BDR Nexus - GMAO Industrial Management System"
authors = ["BDR Nexus Team"]
license = "Apache-2.0"
repository = ""
default-run = "bdr-nexus-gmao"
edition = "2021"
rust-version = "1.65"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = ["api-all"] }

[features]
# by default tauri system-tray feature is enabled
custom-protocol = [ "tauri/custom-protocol" ]
